name: Publish WordPress plugin
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and PHP
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          header = pathlib.Path('tourism-core.php').read_text()
          constants = pathlib.Path('config/constants.php').read_text()
          readme = pathlib.Path('readme.txt').read_text()
          assert re.search(r'Version: ' + re.escape(version) + r'\s', header)
          assert "'TOURISM_CORE_VERSION', '" + version + "'" in constants
          assert 'Stable tag: ' + version + '\n' in readme
          PY
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php tests/github-updater-test.php
          php tests/github-updater-test.php private
          php tests/regression-test.php
      - name: Build installable archive
        run: git archive --format=zip --prefix=tourism-core/ --output=tourism-core.zip HEAD
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" tourism-core.zip --verify-tag --title "Tourism Core $RELEASE_TAG" --generate-notes
